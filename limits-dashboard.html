<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モデル利用枠</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#202c27;font:15px/1.5 'Hiragino Sans',sans-serif}main{max-width:1120px;margin:8vh auto;padding:0 24px}header,footer,.legend,.labels,.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header,.labels,.tools{justify-content:space-between}header{border-bottom:1px solid #bdc9be;padding-bottom:20px}h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}small,footer,.labels{color:#506057}button{background:white;color:inherit;border:1px solid #bac6bb;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#244e3e;color:white;border-color:#244e3e}.tools{margin:24px 0;justify-content:flex-end}.legend{gap:8px}.sample{display:inline-block;background:#398768;width:20px;height:9px;border-radius:2px}.tick{height:16px;border-left:2px solid #202c27;margin-left:8px}.grid{display:grid;grid-template-columns:minmax(170px,.8fr) repeat(2,minmax(0,1fr));gap:1px;background:#d5ddd4;border:1px solid #d5ddd4;border-radius:12px;overflow:hidden}.grid>*,#rows>*{padding:19px 24px;background:white}.head{background:#e6ece4;font-weight:650}.model{display:flex;gap:5px;flex-direction:column;justify-content:center;font-size:20px}.model small{font-size:13px}.value{font:650 33px/1.2 ui-monospace,monospace;letter-spacing:-2px}.value span{font-size:18px}.bar{margin:12px 0;height:10px;border-radius:4px;background:#e5ebe5;position:relative}.bar i{display:block;height:100%;background:#398768;border-radius:4px}.bar b{position:absolute;top:-4px;height:18px;border-left:2px solid #202c27}.low i{background:#ba722b}.labels{font-size:13px;gap:4px}.empty{display:grid;align-content:center;color:#667368}.mobile{display:none}footer{margin-top:18px;font-size:13px}.grid.single{grid-template-columns:minmax(170px,.8fr) minmax(0,2fr)}[hidden]{display:none!important}@media(max-width:700px){main{margin:24px auto;padding:0 16px}.grid,.grid.single{display:block;background:white}.grid>*,#rows>*{padding:14px 18px}.head{display:none}.model{background:#e6ece4}.mobile{display:block;font-size:13px;font-weight:bold}.empty{display:block}.tools{gap:12px}.cell+.cell{border-top:1px solid #edf0eb}}
.tickets{margin:24px 0;background:white;border:1px solid #d5ddd4;border-radius:12px;padding:16px 24px}
.tickets h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:20px;margin:0}
.tickets h2 small{font-size:15px;color:#24503d}
.tickets ul{list-style:none;padding:0;margin:12px 0 0}
.tickets li{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:8px 0;border-top:1px solid #e5ebe5}
.meter-label{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;color:#405349;font-size:13px}
.meter-label strong{font-variant-numeric:tabular-nums}
.bar.overlay{height:16px;margin:6px 0 10px;background:#eff1f0;border-radius:4px;overflow:hidden}
.overlay .period-fill{position:absolute;inset:0 auto 0 0;background:#c2cdd8;border-radius:4px}
.overlay i{position:absolute;left:0;top:5px;height:6px}
.tickets .credit{display:grid;grid-template-columns:8em minmax(48px,1fr) 10em}
.credit .bar{margin:0}
.credit.warning i{background:#b77425}
.credit.error i{background:#b74739}
@media(max-width:540px){.tickets .credit{grid-template-columns:1fr auto;gap:5px}.credit>div{grid-column:1/-1;grid-row:2}}
</style>
<main><header><h1>モデル利用枠</h1><small id="snapshot" role="status">$snapshot</small></header>
<div class="tools">
<div id="filters" aria-label="表示する期間">
<button data-mode="all" aria-pressed="true">すべて</button>
<button data-mode="short" aria-pressed="false">5時間</button>
<button data-mode="week" aria-pressed="false">週間</button>
</div></div>
<div class="grid" id="grid">
<div class="head">モデル・共有枠</div>
<div class="head" data-period="short">5時間枠</div>
<div class="head" data-period="week">週間枠</div>
<div id="rows" style="display:contents">$rows</div>
</div>
<div id="other">$other</div>
<footer>週間の「期間の残り」は毎日 09:00–20:00（JST）の利用時間で計算。リセットまでの時間は実時間で表示。</footer>
<div id="tickets">$tickets</div>
</main>
<script>
async function refresh() {
  const stamp = document.querySelector('#snapshot');
  try {
    const response = await fetch('/api/limits', {
      headers: {'X-Agent-Limits': 'dashboard'},
      cache: 'no-store'
    });
    if (!response.ok) throw new Error();
    const data = await response.json();
    for (const key of ['rows', 'other', 'tickets']) {
      document.getElementById(key).innerHTML = data[key];
    }
    stamp.textContent = data.snapshot;
    document.querySelector('#filters button[aria-pressed="true"]').click();
  } catch {
    stamp.textContent = '更新に失敗しました。再読み込みしてください。';
  }
}
if ($live) refresh();
const grid = document.querySelector('#grid');
const buttons = document.querySelectorAll('#filters button');
for (const button of buttons) {
  button.onclick = () => {
    const mode = button.dataset.mode;
    for (const item of grid.querySelectorAll('[data-period]')) {
      item.hidden = mode !== 'all' && mode !== item.dataset.period;
    }
    grid.classList.toggle('single', mode !== 'all');
    for (const other of buttons) other.setAttribute('aria-pressed', String(other === button));
  };
}
</script></html>
