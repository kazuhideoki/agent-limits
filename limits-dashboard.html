<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モデル利用枠</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#202c27;font:15px/1.5 'Hiragino Sans',sans-serif}main{max-width:1120px;margin:clamp(8px,2vh,22px) auto;padding:0 24px}header,footer,.legend,.labels,.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header,.labels,.tools{justify-content:space-between}header{border-bottom:1px solid #bdc9be;padding-bottom:8px}h1{margin:0;font-size:clamp(23px,2.3vw,30px);letter-spacing:-.04em}small,footer,.labels{color:#506057}button{background:white;color:inherit;border:1px solid #bac6bb;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#244e3e;color:white;border-color:#244e3e}.tools{margin:9px 0;justify-content:space-between}.legend{gap:8px}.sample{display:inline-block;background:#398768;width:20px;height:9px;border-radius:2px}.tick{height:16px;border-left:2px solid #202c27;margin-left:8px}.grid{display:grid;grid-template-columns:minmax(170px,.8fr) repeat(2,minmax(0,1fr));gap:1px;background:#d5ddd4;border:1px solid #d5ddd4;border-radius:12px;overflow:hidden}.grid>*,.provider>*{padding:7px 16px;background:white}.head{background:#e6ece4;font-weight:650}.model{display:flex;gap:5px;flex-direction:column;justify-content:center;font-size:17px}.model small{font-size:13px}.value{font:650 19px/1.1 ui-monospace,monospace;letter-spacing:-.03em}.value span{font-size:13px}.bar{margin:12px 0;height:10px;border-radius:4px;background:#e5ebe5;position:relative}.bar i{display:block;height:100%;background:#398768;border-radius:4px}.bar b{position:absolute;top:-4px;height:18px;border-left:2px solid #202c27}.low i{background:#ba722b}.labels{font-size:13px;gap:4px}.empty{display:grid;align-content:center;color:#667368}.mobile{display:none}footer{margin-top:6px;font-size:12px}.grid.single{grid-template-columns:minmax(170px,.8fr) minmax(0,2fr)}[hidden]{display:none!important}@media(max-width:700px){main{margin:24px auto;padding:0 16px}.grid,.grid.single{display:block;background:white}.grid>*,.provider>*{padding:14px 18px}.head{display:none}.model{background:#e6ece4}.mobile{display:block;font-size:13px;font-weight:bold}.empty{display:block}.tools{gap:12px}.cell+.cell{border-top:1px solid #edf0eb}}
.tickets{margin:10px 0;background:white;border:1px solid #d5ddd4;border-radius:12px;padding:9px 16px}
.tickets h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:16px;margin:0}
.tickets h2 small{font-size:15px;color:#24503d}
.tickets ul{list-style:none;padding:0;margin:12px 0 0}
.tickets li{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:8px 0;border-top:1px solid #e5ebe5}
.meter-label{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;color:#405349;font-size:13px}
.meter-label strong{font-variant-numeric:tabular-nums}
.bar.overlay{height:10px;margin:2px 0 3px;background:#eff1f0;border-radius:4px;overflow:hidden}
.overlay .period-fill{position:absolute;inset:0 auto 0 0;background:#c2cdd8;border-radius:4px}
.overlay i{position:absolute;left:0;top:3px;height:4px}
.tickets .credit{display:grid;grid-template-columns:8em minmax(48px,1fr) 10em}
.credit .bar{margin:0}
.credit.warning i{background:#b77425}
.credit.error i{background:#b74739}
@media(max-width:540px){.tickets .credit{grid-template-columns:1fr auto;gap:5px}.credit>div{grid-column:1/-1;grid-row:2}}
#results{display:flow-root}
.provider{display:contents}
[data-part] > *{position:relative}
.extra:not(:has(li)),.extra ul:empty{display:none}
[data-part][aria-busy="true"] > *::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;
  background:linear-gradient(105deg,transparent 32%,rgba(222,235,227,.36) 44%,rgba(255,255,255,.60) 50%,rgba(222,235,227,.36) 56%,transparent 68%);
  background-size:280% 100%;animation:shimmer 2.2s ease-in-out infinite;
}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){
  [data-part][aria-busy="true"] > *::after{animation:none;background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(106,142,123,.12) 7px 8px)}
}
#refresh-state:not(.error){position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#refresh-state.error{color:#893e29}
.scope{margin-right:8px;font-size:12px;color:#405349}
.time-value{color:#566978;font-variant-numeric:tabular-nums}
.cell hr{border:0;border-top:1px solid #e1e7e1;margin:5px 0}
.legend{font-size:12px;color:#47594f}
.legend .sample{width:17px;height:4px}
.legend .period-key{width:17px;height:10px;border-radius:3px;background:#c2cdd8}
@media(min-width:701px){
  #tickets ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 20px;margin-top:5px}
  #tickets .credit{display:grid;grid-template-columns:1fr auto;gap:3px;font-size:13px;padding:4px 0}
  #tickets .credit>div{grid-column:1/-1;grid-row:2}
  .credit-bar{height:6px}
}
@media(min-width:701px) and (max-height:680px){
  main{margin:4px auto}
  header{padding-bottom:3px}
  .tools{margin:4px 0}
  .grid>.head,.provider>*{padding:4px 12px}
  .labels{font-size:12px;line-height:1.25}
  .cell hr{margin:3px 0}
  #tickets .tickets{margin:5px 0;padding:6px 12px}
  #tickets h2{display:inline-flex;margin-right:14px}
  #tickets ul{margin-top:2px}
}
</style>
<main><header><h1>モデル利用枠</h1><small id="snapshot" role="status">$snapshot</small></header>
<div id="refresh-state" role="status" hidden></div>
<div class="tools"><div class="legend"><i class="sample"></i>利用枠残り <i class="period-key"></i>期間残り</div>
<div id="filters" aria-label="表示する期間">
<button data-mode="all" aria-pressed="true">すべて</button>
<button data-mode="short" aria-pressed="false">5時間</button>
<button data-mode="week" aria-pressed="false">週間</button>
</div></div>
<div id="results" aria-busy="false">
<div class="grid" id="grid">
<div class="head">モデル・共有枠</div>
<div class="head" data-period="short">5時間枠</div>
<div class="head" data-period="week">週間枠</div>
<div id="rows" style="display:contents">$rows</div>
</div>
<div id="other">$other</div>
<footer>週間の「期間の残り」は毎日 09:00–20:00（JST）の利用時間で計算。リセットまでの時間は実時間で表示。</footer>
<div id="tickets">$tickets</div>
</div>
</main>
<script>
async function refresh() {
  const stamp = document.querySelector('#snapshot');
  const state = document.querySelector('#refresh-state');
  const previous = stamp.textContent;
  state.hidden = false;
  const parts = new Map(Array.from(document.querySelectorAll('[data-part]'), el => [el.dataset.part, el]));
  for (const el of parts.values()) el.setAttribute('aria-busy', 'true');
  state.textContent = previous ? '利用枠を更新中…' : '各サービスの利用枠を取得中…';
  try {
    const response = await fetch('/api/refresh', {
      headers: {'X-Agent-Limits': 'dashboard'},
      cache: 'no-store'
    });
    if (!response.ok) throw new Error();
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    let completed = 0;
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      const lines = (buffer + value).split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const part = JSON.parse(line);
        const el = parts.get(part.key);
        el.innerHTML = part.key === 'tickets' ? part.tickets : part.rows;
        if (part.key !== 'tickets') {
          document.querySelector('[data-other="' + part.key + '"]').innerHTML = part.other;
        }
        el.setAttribute('aria-busy', 'false');
        stamp.textContent = part.snapshot;
        completed++;
        document.querySelector('#filters button[aria-pressed="true"]').click();
      }
    }
    if (completed !== parts.size) throw new Error();
    state.hidden = true;
  } catch {
    state.classList.add('error');
    state.textContent = '一部の更新が完了しませんでした。再読み込みしてください。';
  } finally {
    for (const el of parts.values()) el.setAttribute('aria-busy', 'false');
  }
}
if ($live) refresh();
const grid = document.querySelector('#grid');
const buttons = document.querySelectorAll('#filters button');
for (const button of buttons) {
  button.onclick = () => {
    const mode = button.dataset.mode;
    for (const item of grid.querySelectorAll('[data-period]')) {
      item.hidden = mode !== 'all' && mode !== item.dataset.period;
    }
    grid.classList.toggle('single', mode !== 'all');
    for (const other of buttons) other.setAttribute('aria-pressed', String(other === button));
  };
}
</script></html>
