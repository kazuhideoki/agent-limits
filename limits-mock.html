<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モデル利用枠</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#202c27;font:15px/1.5 'Hiragino Sans',sans-serif}main{max-width:1120px;margin:8vh auto;padding:0 24px}header,footer,.legend,.labels,.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header,.labels,.tools{justify-content:space-between}header{border-bottom:1px solid #bdc9be;padding-bottom:20px}h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}small,footer,.labels{color:#506057}button{background:white;color:inherit;border:1px solid #bac6bb;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#244e3e;color:white;border-color:#244e3e}.tools{margin:24px 0}.legend{gap:8px}.sample{display:inline-block;background:#398768;width:20px;height:9px;border-radius:2px}.tick{height:16px;border-left:2px solid #202c27;margin-left:8px}.grid{display:grid;grid-template-columns:minmax(170px,.8fr) repeat(2,minmax(0,1fr));gap:1px;background:#d5ddd4;border:1px solid #d5ddd4;border-radius:12px;overflow:hidden}.grid>*{padding:19px 24px;background:white}.head{background:#e6ece4;font-weight:650}.model{display:flex;gap:5px;flex-direction:column;justify-content:center;font-size:20px}.model small{font-size:13px}.value{font:650 33px/1.2 ui-monospace,monospace;letter-spacing:-2px}.value span{font-size:18px}.bar{margin:12px 0;height:10px;border-radius:4px;background:#e5ebe5;position:relative}.bar i{display:block;height:100%;background:#398768;border-radius:4px}.bar b{position:absolute;top:-4px;height:18px;border-left:2px solid #202c27}.low i{background:#ba722b}.labels{font-size:13px;gap:4px}.empty{display:grid;align-content:center;color:#667368}.mobile{display:none}footer{margin-top:18px;font-size:13px}.grid.single{grid-template-columns:minmax(170px,.8fr) minmax(0,2fr)}[hidden]{display:none!important}@media(max-width:700px){main{margin:24px auto;padding:0 16px}.grid,.grid.single{display:block;background:white}.grid>*{padding:14px 18px}.head{display:none}.model{background:#e6ece4}.mobile{display:block;font-size:13px;font-weight:bold}.empty{display:block}.tools{gap:12px}.cell+.cell{border-top:1px solid #edf0eb}}
.tickets{margin:24px 0;background:white;border:1px solid #d5ddd4;border-radius:12px;padding:16px 24px}
.tickets h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:20px;margin:0}
.tickets h2 small{font-size:15px;color:#24503d}
.tickets ul{list-style:none;padding:0;margin:12px 0 0}
.tickets li{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:8px 0;border-top:1px solid #e5ebe5}
.tickets li:first-child strong{color:#965510}
</style><main><header><h1>モデル利用枠</h1><small>サンプルデータ ｜ 11月25日（水）15:00 JST 時点</small></header><div class="tools"><div class="legend"><i class="sample"></i>利用枠の残量 <i class="tick"></i>期間の残り</div><div id="filters" aria-label="表示する期間"><button data-mode="all" aria-pressed="true">すべて</button> <button data-mode="short" aria-pressed="false">5時間</button> <button data-mode="week" aria-pressed="false">週間</button></div></div><div class="grid" id="grid"></div><footer>週間の「期間の残り」は毎日 09:00–20:00（JST）の利用時間で計算。リセットまでの時間は実時間で表示。</footer>
<section class="tickets">
  <h2>Codex リセットチケット <small>利用可能 2枚</small></h2>
  <ul>
    <li><strong>あと3時間</strong><span>今日 18:00 失効</span></li>
    <li><strong>あと7日</strong><span>12/2（水）15:00 失効</span></li>
  </ul>
</section></main>
<script>
const models=[
 ['Codex','共通枠',null,[72,51,'3日19時間','11/29（日）10:00']],
 ['Claude Code','共通枠 · 3分前に取得',[12,60,'3時間','今日 18:00'],[68,51,'3日19時間','11/29（日）10:00']],
 ['Antigravity','Gemini Models',[80,40,'2時間','今日 17:00'],[45,51,'3日19時間','11/29（日）10:00']]
];
const grid=document.querySelector('#grid');
function add(type,html,period){const el=document.createElement('div');el.className=type;el.innerHTML=html;if(period)el.dataset.period=period;grid.append(el)}
add('head','モデル・共有枠');add('head','5時間枠','short');add('head','週間枠','week');
function cell(data,period,title){const label=`<span class="mobile">${title}</span>`;if(!data){add('cell empty',label+'—　対象枠なし',period);return}const [remaining,time,left,reset]=data;add('cell',`${label}<div class="labels"><strong class="value" aria-label="残量 ${remaining}%">${remaining}<span>%</span></strong><span>期間残り ${time}%</span></div><div aria-hidden="true" class="bar ${remaining<time?'low':''}"><i style="width:${remaining}%"></i><b style="left:${time}%"></b></div><div class="labels"><strong>あと${left}</strong><span>${reset} リセット</span></div>`,period)}
for(const [name,group,short,week] of models){add('model',`<strong>${name}</strong><small>${group}</small>`);cell(short,'short','5時間枠');cell(week,'week','週間枠')}
for(const button of document.querySelectorAll('button'))button.onclick=()=>{const mode=button.dataset.mode;for(const item of grid.querySelectorAll('[data-period]'))item.hidden=mode!=='all'&&mode!==item.dataset.period;grid.classList.toggle('single',mode!=='all');for(const other of document.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===button))};
</script></html>
